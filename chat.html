<body class="chat-flag-bg">
    <div class="chat-app">
        <div class="chat-header">
            <div class="header-title-container">
                <span style="font-size: 2rem;">🌾🚜</span>
                <div class="ai-avatar">🤖</div>
                <div>
                    <h3>AgriAI Assistant</h3>
                    <p>Powered by Advanced Agriculture Intelligence</p>
                </div>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <button onclick="clearChat()" class="back-btn" style="font-weight: normal; font-size: 19px;">♻
                    Clear</button>
                <a href="index.html" class="back-btn">⬅ Back</a>
            </div>
        </div>

        <div id="chatMessages" class="chat-container">
            <!-- Chat History -->
        </div>

        <div class="chat-input-container">
            <div class="input-wrapper">
                <input type="text" id="chatInput" style="font-size: 18px !important;" placeholder="Message" onkeypress="if(event.key === 'Enter' && typeof sendChatMessage === 'function') sendChatMessage()">
                <button id="sendMessage" class="btn" style="background: linear-gradient(135deg, #16a085, #1abc9c);" onclick="if(typeof sendChatMessage === 'function') sendChatMessage()">➤</button>
                <button id="aiMicBtn" class="btn">🎤</button>
            </div>
        </div>
    </div>

    <!-- Assets required for local fallback and UI variables -->
    <script src="js/crops.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/ai_core.js"></script>

    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const lang = localStorage.getItem("language") || "en";
            
            const clearBtn = document.querySelector('button[onclick="clearChat()"]');
            const backBtn = document.querySelector('a.back-btn[href="index.html"]');
            const placeholder = document.getElementById("chatInput");
            
            const aiTitle = document.querySelector('.chat-header h3');
            const aiDesc = document.querySelector('.chat-header p');
            
            if (lang === "hi") {
                if(clearBtn) clearBtn.innerHTML = "♻ साफ़ करें";
                if(backBtn) backBtn.innerHTML = "⬅ वापस";
                if(placeholder) placeholder.placeholder = "टाइप करें या बोलें...";
                if(aiTitle) aiTitle.innerHTML = "AgriAI सहायक";
                if(aiDesc) aiDesc.innerHTML = "उन्नत कृषि बुद्धिमत्ता द्वारा संचालित";
            } else if (lang === "te") {
                if(clearBtn) clearBtn.innerHTML = "♻ క్లియర్";
                if(backBtn) backBtn.innerHTML = "⬅ వెనుకకు";
                if(placeholder) placeholder.placeholder = "టైప్ చేయండి లేదా మాట్లాడండి...";
                if(aiTitle) aiTitle.innerHTML = "AgriAI సహాయకుడు";
                if(aiDesc) aiDesc.innerHTML = "అధునాతన వ్యవసాయ మేధస్సుతో పనిచేస్తుంది";
            }
        });
    </script>

    <!-- SECURE AUTO ROUTING ALGORITHM -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const queryCategory = urlParams.get('q');
            if (queryCategory) {
                setTimeout(() => {
                    let chatInput = document.getElementById('chatInput');
                    if (chatInput) {
                        chatInput.value = `Strictly list and rank the top 10 most profitable ${queryCategory} to cultivate. DO NOT greet. Create a strict HTML table as requested in the system prompt.`;
                        
                        let sendBtn = document.getElementById('sendMessage');
                        if (sendBtn) {
                            sendBtn.click();
                        } else if (typeof sendChatMessage === 'function') {
                            sendChatMessage();
                        }
                    }
                    // Strip the URL so refreshing doesn't re-trigger it endlessly
                    window.history.replaceState({}, document.title, window.location.pathname);
                }, 600);
            }
        });
    </script>

</body>
