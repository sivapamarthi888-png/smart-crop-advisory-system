 placeholder="Or type crop name & symptoms here...">

<script>
        // CRITICAL FOR MOBILE: Asynchronous TTS unlocks must be primed by a synchronous user gesture!
        let audioUnlocked = false;
        document.addEventListener('click', () => {
            if (!audioUnlocked && 'speechSynthesis' in window) {
                let u = new SpeechSynthesisUtterance("");
                window.speechSynthesis.speak(u);
                audioUnlocked = true;
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        let currentType = urlParams.get('type') || 'schemes';
        var appCurrentLang = localStorage.getItem('language') || 'te';
        let uploadedImageB64 = null;

        const DATA = {
            schemes: [
                { icon: "💰", en: { title: "PM-KISAN", desc: "Income support scheme for farmers.", linkText: "Official Portal", url: "https://pmkisan.gov.in" }, te: { title: "పిఎం-కిసాన్", desc: "రైతులకు ఆదాయ మద్దతు పథకం.", linkText: "అధికారిక వెబ్‌సైట్", url: "https://pmkisan.gov.in" }, hi: { title: "पीएम-किसान", desc: "किसानों के लिए आय सहायता योजना।", linkText: "आधिकारिक वेबसाइट", url: "https://pmkisan.gov.in" } },
                { icon: "🛡", en: { title: "PMFBY", desc: "Crop insurance protection.", linkText: "Official Portal", url: "https://pmfby.gov.in" }, te: { title: "ఫసల్ బీమా యోజన", desc: "పంటల భీమా రక్షణ పథకం.", linkText: "అధికారిక వెబ్‌సైట్", url: "https://pmfby.gov.in" }, hi: { title: "फसल बीमा योजना", desc: "फसल बीमा सुरक्षा।", linkText: "आधिकारिक वेबसाइट", url: "https://pmfby.gov.in" } },
                { icon: "🌱", en: { title: "Soil Health Card", desc: "Improve soil productivity.", linkText: "Official Portal", url: "https://soilhealth.dac.gov.in" }, te: { title: "సాయిల్ హెల్త్ కార్డ్", desc: "మట్టి సారం పెంపుదల.", linkText: "అధికారిక వెబ్‌సైట్", url: "https://soilhealth.dac.gov.in" }, hi: { title: "मृदा स्वास्थ्य कार्ड", desc: "मिट्टी की उर्वरता बढ़ाएं।", linkText: "आधिकारिक वेबसाइट", url: "https://soilhealth.dac.gov.in" } }
            ],
            services: [
                { icon: "🧪", en: { title: "Soil Testing Centers", desc: "Assess soil nutrients.", linkText: "Find Nearby", url: "https://soilhealth.dac.gov.in" }, te: { title: "మట్టి పరీక్షా కేంద్రాలు", desc: "మట్టి పోషకాల అంచనా.", linkText: "దగ్గర్లో వెతకండి", url: "https://soilhealth.dac.gov.in" }, hi: { title: "मृदा परीक्षण केंद्र", desc: "मिट्टी के पोषक तत्वों का आकलन करें।", linkText: "आस-पास खोजें", url: "https://soilhealth.dac.gov.in" } },
                { icon: "🏪", en: { title: "Fertilizer Stores", desc: "Buy recommended fertilizers.", linkText: "Find Nearby", url: "https://dbtfert.nic.in/" }, te: { title: "ఎరువుల దుకాణాలు", desc: "విశ్వసనీయ ఎరువులు కొనండి.", linkText: "దగ్గర్లో వెతకండి", url: "https://dbtfert.nic.in/" }, hi: { title: "उर्वरक की दुकानें", desc: "अनुशंसित उर्वरक खरीदें।", linkText: "आस-पास खोजें", url: "https://dbtfert.nic.in/" } },
                { icon: "🏫", en: { title: "Krishi Vigyan Kendras", desc: "Expert farming advice.", linkText: "Find Nearby", url: "https://icar.org.in/" }, te: { title: "కృషి విజ్ఞాన కేంద్రాలు", desc: "నిపుణులచే సలహాలు పొందండి.", linkText: "దగ్గర్లో వెతకండి", url: "https://icar.org.in/" }, hi: { title: "कृषि विज्ञान केंद्र", desc: "विशेषज्ञ कृषि सलाह।", linkText: "आस-पास खोजें", url: "https://icar.org.in/" } }
            ],
            market: [
                { icon: "📱", en: { title: "e-NAM", desc: "Pan-India electronic trading portal.", linkText: "Live Prices", url: "https://enam.gov.in" }, te: { title: "e-NAM", desc: "అఖిల-భారత వ్యవసాయ మార్కెట్.", linkText: "లైవ్ ధరలు చూడండి", url: "https://enam.gov.in" }, hi: { title: "ई-नाम", desc: "अखिल भारतीय इलेक्ट्रॉनिक ट्रेडिंग पोर्टल।", linkText: "लाइव कीमतें देखें", url: "https://enam.gov.in" } },
                { icon: "📈", en: { title: "Agmarknet", desc: "Commodity arrivals and prices.", linkText: "Check Market", url: "https://agmarknet.gov.in/" }, te: { title: "అగ్‌మార్క్‌నెట్", desc: "రైతు ఉత్పత్తుల ధరలు.", linkText: "మార్కెట్ చూడండి", url: "https://agmarknet.gov.in/" }, hi: { title: "एगमार्कनेट", desc: "वस्तु आगमन और कीमतें।", linkText: "बाजार जांचें", url: "https://agmarknet.gov.in/" } }
            ]
        };

        
        document.addEventListener("DOMContentLoaded", () => {
            const savedLang = localStorage.getItem("language");
            if (savedLang) {
                appCurrentLang = savedLang;
                document.getElementById('axiomOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                initPage(currentType);
            }
        });
        
        function selectLang(l) {
            appCurrentLang = l;
            document.getElementById('axiomOverlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            initPage(currentType);
        }

        const titles = {
            disease: { en: "Disease Detection", te: "తెగుళ్ల నిర్ధారణ", hi: "रोग का पता लगाना" },
            market: { en: "Market Intelligence", te: "మార్కెట్ ఇంటెలిజెన్స్", hi: "बाजार आसूचना" },
            weather: { en: "Weather Intelligence", te: "వాతావరణ ఇంటెలిజెన్స్", hi: "मौसम आसूचना" },
            schemes: { en: "Government Schemes", te: "ప్రభుత్వ పథకాలు", hi: "सरकारी योजनाएं" },
            services: { en: "Nearby Services", te: "సమీప వ్యవసాయ సేవలు", hi: "पास की कृषि सेवाएं" }
        };

    function initPage(type) {
        document.getElementById('cardsContainer').innerHTML = '';
        
        let titleBlock = document.getElementById('pageTitle');
        if (titleBlock && titles[type]) {
            titleBlock.innerText = appCurrentLang === 'en' ? titles[type].en : (appCurrentLang === 'te' ? titles[type].te : titles[type].hi);
        }

        if (type === 'schemes' || type === 'services') {
            document.getElementById('interactiveBox').style.display = 'none';
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('loadingIndicator').innerText = "Accessing Database...";
            
            buildStatic(DATA[type]);
        } else if (type === 'market') {
            document.getElementById('interactiveBox').style.display = 'none';
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('loadingIndicator').innerText = "AXIOM is connecting to live databases...";
            
            setTimeout(() => generateMarketLive(), 500);
        } else if (type === 'disease') {
            document.getElementById('interactiveBox').style.display = 'block';
            
            // UI Translations for the Disease Module
            const tGallery = appCurrentLang === 'te' ? '📁 గ్యాలరీ' : (appCurrentLang === 'hi' ? '📁 गैलरी' : '📁 Gallery');
            const tCamera = appCurrentLang === 'te' ? '📷 కెమెరా' : (appCurrentLang === 'hi' ? '📷 कैमरा' : '📷 Camera');
            const tPlace = appCurrentLang === 'te' ? 'లేదా పంట పేరు & లక్షణాలను ఇక్కడ వ్రాయండి...' : (appCurrentLang === 'hi' ? 'या फसल का नाम और लक्षण यहाँ लिखें...' : 'Or type crop name & symptoms here...');
            const tAsk = appCurrentLang === 'te' ? 'విశ్లేషించు (Ask)' : (appCurrentLang === 'hi' ? 'विश्लेषण करें (Ask)' : 'Ask AXIOM');
            
            if(document.getElementById('lblGallery')) document.getElementById('lblGallery').innerHTML = tGallery + '<input type="file" accept="image/*" onchange="handleImage(event)">';
            if(document.getElementById('lblCamera')) document.getElementById('lblCamera').innerHTML = tCamera + '<input type="file" accept="image/*" capture="environment" onchange="handleImage(event)">';
            
            if(document.getElementById('diseaseInput')) document.getElementById('diseaseInput').placeholder = tPlace;
            if(document.querySelector('.send-btn')) document.querySelector('.send-btn').innerText = tAsk;
            
        } else if (type === 'weather') {
            document.getElementById('interactiveBox').style.display = 'none';
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('loadingIndicator').innerText = "AXIOM is activating Regional Radar...";
            
            setTimeout(() => generateWeatherSuggestions(), 500);
        }
    }

    

    function buildStatic(dataArr) {
        let html = "";
        let tText = document.getElementById('pageTitle').innerText;
        let speechContent = appCurrentLang === 'en' ? 'Accessing ' + tText + "   " : (appCurrentLang === 'te' ? tText + ' చూస్తున్నాను   ' : tText + ' दिखा रहा हूँ   ');
        dataArr.forEach(item => {
            let data = item[appCurrentLang] || item['en'];
            speechContent += data.title + "  " + data.desc + "  ";
            html += `<div class="detail-card">`;
            html += `<div class="card-header"><div class="card-icon">${item.icon}</div><h2 class="card-title">${data.title}</h2></div>`;
            html += `<p class="card-desc">${data.desc}</p>`;
            html += `<a href="${data.url}" class="card-link" target="_blank">${data.linkText} →</a>`;
            html += `</div>`;
        });
        html += `<br><button onclick="if(typeof speakText === 'function') speakText(this.dataset.text);" data-text="${speechContent.replace(/"/g, '&quot;')}" style="background:#22c55e; color:#000; border:none; padding:10px 20px; border-radius:30px; font-weight:bold; font-size:16px; width:100%; cursor:pointer;">${appCurrentLang === "te" ? "🔊 బిగ్గరగా చదవండి (Read)" : (appCurrentLang === "hi" ? "🔊 जोर से पढ़ें (Read)" : "🔊 Read Aloud")}</button>`;
        document.getElementById('cardsContainer').innerHTML = html;
        if(typeof speakText === 'function') setTimeout(() => speakText(speechContent), 500);
    }

    
    // uploadedImageB64 already declared globally
    function handleImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImageB64 = e.target.result.split(',')[1];
                document.getElementById('imgPreview').src = e.target.result;
                document.getElementById('imgPreview').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    async function askDisease() {
        let query = document.getElementById('diseaseInput').value.trim();
        if (!uploadedImageB64 && !query) {
            alert("Please upload/take a photo or type a symptom.");
            return;
        }
        
        document.getElementById('loadingIndicator').style.display = 'block';
        
        try {
            let langName = appCurrentLang === 'te' ? 'Telugu' : (appCurrentLang === 'hi' ? 'Hindi' : 'English');
            let promptConfig = "You are AXIOM, an expert agricultural AI. The user is asking about a disease.\nLanguage: " + langName + "\nUser text/query: " + query + "\n\nCRITICAL INSTRUCTION: Analyze the image. Give exact disease name and chemical cures entirely converted to the specified Language. (Stricly output English if requested!). Format neatly.";
            
            let contents = [];
            if (uploadedImageB64) {
                contents.push({
                    role: "user",
                    parts: [
                        { text: promptConfig },
                        { inlineData: { mimeType: "image/jpeg", data: uploadedImageB64 } }
                    ]
                });
            } else {
                contents.push({ role: "user", parts: [{ text: promptConfig }] });
            }
            
            let apiKey = typeof GEMINI_API_KEY !== 'undefined' ? GEMINI_API_KEY : (typeof config !== 'undefined' ? config.GEMINI_API_KEY : '');
            let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: contents })
            });
            
            let data = await res.json();
            let reply = data.candidates[0].content.parts[0].text;
            
            reply = reply.replace(/```html/g, '').replace(/```/g, ''); 
            
            document.getElementById('loadingIndicator').style.display = 'none';
            
            let imgHtml = uploadedImageB64 ? `<img src="data:image/jpeg;base64,${uploadedImageB64}" style="width:100%; max-height:200px; object-fit:cover; border-radius:10px; margin-bottom:15px;">` : '';
            
            document.getElementById('cardsContainer').innerHTML = `
                <div class="disease-cure-box" style="border-color:#22c55e;">
                    <h2 style="margin-top:0; color:#22c55e;">🦠 Diagnosis Report</h2>
                    ${imgHtml}
                    <div style="flex-grow: 1; font-size: 1.3rem; line-height: 2.2; margin-top: 15px; margin-bottom: 25px;"><div style="flex-grow: 1; font-size: 1.3rem; line-height: 2.2; margin-top: 15px; margin-bottom: 25px;">${reply.replace(/\n/g, '<br><br>').replace(/- /g, '<br>🟢 ').replace(/\n/g, '<br><br>').replace(/- /g, '<br>👉 ')}</div></div>
